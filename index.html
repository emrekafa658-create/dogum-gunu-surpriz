<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Sana Özel 💖</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    padding: 0;
    background-color: #ffe6eb;
    font-family: Arial, sans-serif;
    text-align: center;
}

h1 {
    margin-top: 20px;
}

#character {
    width: 260px;
    margin: 20px auto;
    display: block;
}

.buttons {
    margin-top: 20px;
}

.buttons button {
    margin: 5px;
    padding: 12px 18px;
    font-size: 18px;
    border: none;
    border-radius: 15px;
    cursor: pointer;
}

#reaction {
    margin-top: 20px;
    font-size: 20px;
}
</style>
</head>

<body>

<h1>Doğum Günün Kutlu Olsun 🎂💘</h1>

<img src="a.png" id="character">

<div class="buttons">
    <button onclick="kiss()">💋 Öp</button>
    <button onclick="love()">🫶 Sev</button>
    <button onclick="slap()">👋 Tokat</button>
    <button onclick="kick()">🦵 Tekme</button>
</div>

<div id="reaction"></div>

<script>
function kiss() {
    document.getElementById("reaction").innerText =
        "Tamamdır eserim 😘 Kalbim eridi";
}

function love() {
    document.getElementById("reaction").innerText =
        "Biraz daha sev yaa 🥹❤️";
}

function slap() {
    document.getElementById("reaction").innerText =
        "Haydaa! Ne oldu şimdi 😵";
}

function kick() {
    document.getElementById("reaction").innerText =
        "Tamam tamam sakin 😭";
}
</script>

</body>
</html>
