<script>
// SESLER
const soundOh  = new Audio("oh.mp3");   // öp
const soundAh  = new Audio("ah.mp3");   // tokat
const soundAh2 = new Audio("ah2.mp3");  // tekme
const soundSev = new Audio("sev.mp3");  // sev
const bgMusic  = new Audio("bg.mp3");   // arka plan

bgMusic.loop = true;
bgMusic.volume = 0.3;

let musicStarted = false;

function startMusic() {
    if (!musicStarted) {
        bgMusic.play();
        musicStarted = true;
    }
}

function playSound(sound, text) {
    startMusic();
    sound.currentTime = 0;
    sound.play();
    document.getElementById("reaction").innerText = text;
}

/* 🔥 EMOJI YAĞMURU */
function emojiRain(emoji, count) {
    for (let i = 0; i < count; i++) {
        const e = document.createElement("div");
        e.className = "emoji";
        e.innerText = emoji;
        e.style.left = Math.random() * 100 + "vw";
        e.style.fontSize = (22 + Math.random() * 18) + "px";
        document.body.appendChild(e);
        setTimeout(() => e.remove(), 2200);
    }
}

// BUTONLAR
function kiss() {
    playSound(soundOh, "Öpücük yağmuru 😘💋");
    emojiRain("💋", 25);
}

function love() {
    playSound(soundSev, "Seni çooooook seviyorum 💖");
    emojiRain("💖", 25);
    emojiRain("❤️", 20);
    emojiRain("💕", 15);
}

function slap() {
    playSound(soundAh, "Ayy! 😵");
}

function kick() {
    playSound(soundAh2, "Ahhh! 😭");
}
</script>
