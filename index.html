<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Sana Özel 💖</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
/* 🌈 ARKA PLAN RENK GEÇİŞİ */
body {
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
    text-align: center;
    overflow-x: hidden;
    position: relative;
    animation: bgColor 20s infinite alternate;
}

@keyframes bgColor {
    0% { background-color: #ffe6eb; }
    25% { background-color: #fff0e6; }
    50% { background-color: #e6ffe6; }
    75% { background-color: #e6f0ff; }
    100% { background-color: #ffe6f0; }
}

/* ✨ PARILTI */
#sparkle {
    content: "";
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background:
        radial-gradient(circle at 20% 30%, rgba(255,255,255,0.6), transparent 40%),
        radial-gradient(circle at 80% 20%, rgba(255,255,255,0.5), transparent 45%),
        radial-gradient(circle at 50% 80%, rgba(255,255,255,0.4), transparent 50%);
    pointer-events: none;
    z-index: 0;
    animation: sparkle 6s infinite alternate;
}

@keyframes sparkle {
    0% { opacity: 0.6; }
    100% { opacity: 1; }
}

h1 { margin-top: 20px; }

#character { width: 260px; margin: 20px auto; display: block; }

.buttons button {
    margin: 6px;
    padding: 12px 18px;
    font-size: 18px;
    border: none;
    border-radius: 15px;
    cursor: pointer;
}

#reaction { margin-top: 20px; font-size: 20px; min-height: 30px; }

/* EMOJI */
.emoji {
    position: fixed;
    bottom: 0;
    font-size: 26px;
    animation: floatUp 2.2s ease-out forwards;
    pointer-events: none;
}

@keyframes floatUp {
    0% { transform: translateY(0) scale(1); opacity: 1; }
    100% { transform: translateY(-260px) scale(1.4); opacity: 0; }
}

/* 🎉 KONFETİ */
.confetti {
    position: fixed;
    top: -20px;
    width: 10px; height: 14px;
    animation: fall 3s linear forwards;
    opacity: 0.9;
}

@keyframes fall {
    to { transform: translateY(110vh) rotate(360deg); opacity: 0; }
}
</style>
</head>

<body>

<h1>Doğum Günün Kutlu Olsun 🎂💘</h1>

<img src="a.png" id="character" alt="Karakter">

<div class="buttons">
    <button onclick="kiss()">💋 Öp</button>
    <button onclick="love()">🫶 Sev</button>
    <button onclick="slap()">👋 Tokat</button>
    <button onclick="kick()">🦵 Tekme</button>
</div>

<div id="reaction"></div>
<div id="sparkle"></div>

<script>
// SESLER
const soundOh  = new Audio("oh.mp3");
const soundAh  = new Audio("ah.mp3");
const soundAh2 = new Audio("ah2.mp3");
const soundSev = new Audio("sev.mp3");
const bgMusic  = new Audio("bg.mp3");

bgMusic.loop = true;
bgMusic.volume = 0.3;

let musicStarted = false;

function startMusic() {
    if (!musicStarted) {
        bgMusic.play().catch(()=>{});
        musicStarted = true;
    }
}

function playSound(sound, text) {
    startMusic();
    sound.currentTime = 0;
    sound.play();
    document.getElementById("reaction").innerText = text;
}

/* 💖 EMOJI YAĞMURU */
function emojiRain(emoji, count) {
    for (let i = 0; i < count; i++) {
        const e = document.createElement("div");
        e.className = "emoji";
        e.innerText = emoji;
        e.style.left = Math.random() * 100 + "vw";
        e.style.fontSize = (22 + Math.random() * 18) + "px";
        document.body.appendChild(e);
        setTimeout(() => e.remove(), 2200);
    }
}

/* 🎉 KONFETİ */
function confettiBoom(count = 180) {
    const colors = ["#ff4d6d","#ffd166","#06d6a0","#4cc9f0","#c77dff"];
    for (let i = 0; i < count; i++) {
        const c = document.createElement("div");
        c.className = "confetti";
        c.style.left = Math.random() * 100 + "vw";
        c.style.backgroundColor = colors[Math.floor(Math.random()*colors.length)];
        c.style.animationDuration = (2 + Math.random() * 2) + "s";
        document.body.appendChild(c);
        setTimeout(() => c.remove(), 4000);
    }
}

window.onload = () => confettiBoom();

// PARILTI HIZ ve GÜÇ
const sparkle = document.getElementById("sparkle");
let sparkleSpeed = 6; // normal hız

function setSparkleSpeed(sec) {
    sparkle.style.animationDuration = sec + "s";
}

// BUTONLAR
function kiss() {
    playSound(soundOh, "Öpücük yağmuru 😘💋");
    emojiRain("💋", 25);
    setSparkleSpeed(2); // Hızlanır
}

function love() {
    startMusic();
    soundSev.currentTime = 0;
    soundSev.play();
    document.getElementById("reaction").innerText = "Seni çooooook seviyorum 💖";
    emojiRain("💖", 25);
    emojiRain("❤️", 20);
    emojiRain("💕", 15);
    setSparkleSpeed(1); // Güçlenir ve parıltı belirginleşir
}

function slap() {
    playSound(soundAh, "Ayy! 😵");
}

function kick() {
    playSound(soundAh2, "Ahhh! 😭");
}
</script>

</body>
</html>
