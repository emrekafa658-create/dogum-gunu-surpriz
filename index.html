<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Sana Özel 💖</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
    text-align: center;
    overflow-x: hidden;
    position: relative;
    background: url('arkaplan.png') no-repeat center center fixed;
    background-size: cover;
}

h1 { margin-top: 20px; }

#character {
    width: 260px;
    margin: 20px auto;
    display: block;
    position: relative;
    z-index: 10; /* parıltının üstünde */
}

.buttons button {
    margin: 6px;
    padding: 12px 18px;
    font-size: 18px;
    border: none;
    border-radius: 15px;
    cursor: pointer;
}

#reaction { margin-top: 20px; font-size: 20px; min-height: 30px; }

/* EMOJI */
.emoji {
    position: fixed;
    bottom: 0;
    font-size: 26px;
    animation: floatUp 2.2s ease-out forwards;
    pointer-events: none;
}

@keyframes floatUp {
    0% { transform: translateY(0) scale(1); opacity: 1; }
    100% { transform: translateY(-260px) scale(1.4); opacity: 0; }
}

/* 🎉 KONFETİ */
.confetti {
    position: fixed;
    top: -20px;
    width: 10px; height: 14px;
    animation: fall 3s linear forwards;
    opacity: 0.9;
}

@keyframes fall {
    to { transform: translateY(110vh) rotate(360deg); opacity: 0; }
}

/* 🌟 PARILTI / YILDIZ */
.sparkle {
    position: fixed;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,1) 0%, rgba(255,255,255,0) 70%);
    pointer-events: none;
    animation: sparkleMove linear infinite;
}

@keyframes sparkleMove {
    0% { transform: translateY(0) translateX(0) scale(0.5); opacity: 0.5; }
    50% { transform: translateY(-30px) translateX(10px) scale(1.2); opacity: 1; }
    100% { transform: translateY(0) translateX(-10px) scale(0.5); opacity: 0.5; }
}
</style>
</head>
<body>

<h1>Doğum Günün Kutlu Olsun 🎂💘</h1>

<img src="a.png" id="character" alt="Karakter">

<div class="buttons">
    <button onclick="kiss()">💋 Öp</button>
    <button onclick="love()">🫶 Sev</button>
    <button onclick="slap()">👋 Tokat</button>
    <button onclick="kick()">🦵 Tekme</button>
</div>

<div id="reaction"></div>

<script>
// SESLER
const soundOh  = new Audio("oh.mp3");
const soundAh  = new Audio("ah.mp3");
const soundAh2 = new Audio("ah2.mp3");
const soundSev = new Audio("sev.mp3");
const bgMusic  = new Audio("bg.mp3");

bgMusic.loop = true;
bgMusic.volume = 0.3;

let musicStarted = false;
function startMusic() {
    if (!musicStarted) {
        bgMusic.play().catch(()=>{});
        musicStarted = true;
    }
}

function playSound(sound, text) {
    startMusic();
    sound.currentTime = 0;
    sound.play();
    document.getElementById("reaction").innerText = text;
}

/* 💖 EMOJI YAĞMURU */
function emojiRain(emoji, count) {
    for (let i = 0; i < count; i++) {
        const e = document.createElement("div");
        e.className = "emoji";
        e.innerText = emoji;
        e.style.left = Math.random() * 100 + "vw";
        e.style.fontSize = (22 + Math.random() * 18) + "px";
        document.body.appendChild(e);
        setTimeout(() => e.remove(), 2200);
    }
}

/* 🎉 KONFETİ */
function confettiBoom(count = 180) {
    const colors = ["#ff4d6d","#ffd166","#06d6a0","#4cc9f0","#c77dff"];
    for (let i = 0; i < count; i++) {
        const c = document.createElement("div");
        c.className = "confetti";
        c.style.left = Math.random() * 100 + "vw";
        c.style.backgroundColor = colors[Math.floor(Math.random()*colors.length)];
        c.style.animationDuration = (2 + Math.random() * 2) + "s";
        document.body.appendChild(c);
        setTimeout(() => c.remove(), 4000);
    }
}

window.onload = () => {
    confettiBoom();
    createSparkles(120); // bol yıldız
};

// PARILTI / YILDIZ OLUŞTURMA
function createSparkles(count) {
    const char = document.getElementById("character");
    const charRect = char.getBoundingClientRect();

    for (let i = 0; i < count; i++) {
        const s = document.createElement("div");
        s.className = "sparkle";

        let x, y;
        do {
            x = Math.random() * window.innerWidth;
            y = Math.random() * window.innerHeight;
        } while (
            x > charRect.left && x < charRect.right &&
            y > charRect.top && y < charRect.bottom
        );

        s.style.left = x + "px";
        s.style.top = y + "px";
        s.style.animationDuration = (1 + Math.random()*2) + "s";

        document.body.appendChild(s);
    }
}

// BUTONLAR
function kiss() {
    playSound(soundOh, "Öpücük yağmuru 😘💋");
    emojiRain("💋", 25);
    speedUpSparkles(0.5);
}

function love() {
    startMusic();
    soundSev.currentTime = 0;
    soundSev.play();
    document.getElementById("reaction").innerText = "Seni çooooook seviyorum 💖";
    emojiRain("💖", 25);
    emojiRain("❤️", 20);
    emojiRain("💕", 15);
    strengthenSparkles(2);
    addExtraStars(40); // ekstra yıldız
}

function slap() {
    playSound(soundAh, "Ayy! 😵");
}

function kick() {
    playSound(soundAh2, "Ahhh! 😭");
}

// PARILTI HIZ VE GÜÇ
function speedUpSparkles(factor) {
    document.querySelectorAll(".sparkle").forEach(s => {
        let dur = parseFloat(getComputedStyle(s).animationDuration) || 2;
        s.style.animationDuration = (dur * factor) + "s";
    });
}

function strengthenSparkles(factor) {
    document.querySelectorAll(".sparkle").forEach(s => {
        s.style.transform = `scale(${factor})`;
        s.style.opacity = 1;
    });
}

function addExtraStars(count) {
    const char = document.getElementById("character");
    const charRect = char.getBoundingClientRect();

    for (let i = 0; i < count; i++) {
        const s = document.createElement("div");
        s.className = "sparkle";

        let x, y;
        do {
            x = Math.random() * window.innerWidth;
            y = Math.random() * window.innerHeight;
        } while (
            x > charRect.left && x < charRect.right &&
            y > charRect.top && y < charRect.bottom
        );

        s.style.left = x + "px";
        s.style.top = y + "px";
        s.style.animationDuration = (0.5 + Math.random()*1.5) + "s";
        s.style.transform = "scale(1.5)";
        document.body.appendChild(s);
    }
}
</script>

</body>
</html>
