<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Sana Özel 💖</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    padding: 0;
    background-color: #ffe6eb;
    font-family: Arial, sans-serif;
    text-align: center;
}

#character {
    width: 260px;
    margin: 20px auto;
    display: block;
}

.buttons button {
    margin: 5px;
    padding: 12px 18px;
    font-size: 18px;
    border: none;
    border-radius: 15px;
    cursor: pointer;
}

#reaction {
    margin-top: 20px;
    font-size: 20px;
}
</style>
</head>

<body>

<h1>Doğum Günün Kutlu Olsun 🎂💘</h1>

<img src="a.png" id="character">

<div class="buttons">
    <button onclick="kiss()">💋 Öp</button>
    <button onclick="love()">🫶 Sev</button>
    <button onclick="slap()">👋 Tokat</button>
    <button onclick="kick()">🦵 Tekme</button>
</div>

<div id="reaction"></div>

<script>
const character = document.getElementById("character");

// SESLER
const soundAh = new Audio("ah.mp3");
const soundOh = new Audio("oh.mp3");

// FOTOĞRAFLAR
const normalImg = "a.png";
const slapImg = "a_slap.png";

function changeTemp(img, text, sound) {
    if (sound) {
        sound.currentTime = 0;
        sound.play();
    }

    if (img) {
        character.src = img;
        setTimeout(() => {
            character.src = normalImg;
        }, 500);
    }

    document.getElementById("reaction").innerText = text;
}

function kiss() {
    changeTemp(null, "Ohh 😌💋", soundOh);
}

function love() {
    document.getElementById("reaction").innerText =
        "Biraz daha sev yaa 🥹❤️";
}

function slap() {
    changeTemp(slapImg, "Ayy! 😵", soundAh);
}

function kick() {
    changeTemp(slapImg, "Ahhh! 😭", soundAh);
}
</script>

</body>
</html>
