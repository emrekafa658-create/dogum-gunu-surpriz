<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Sana Özel 💖</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    padding: 0;
    background-color: #ffe6eb;
    font-family: Arial, sans-serif;
    text-align: center;
    overflow-x: hidden;
}

h1 {
    margin-top: 20px;
}

#character {
    width: 260px;
    margin: 20px auto;
    display: block;
}

.buttons button {
    margin: 6px;
    padding: 12px 18px;
    font-size: 18px;
    border: none;
    border-radius: 15px;
    cursor: pointer;
}

#reaction {
    margin-top: 20px;
    font-size: 20px;
    min-height: 30px;
}

/* KALP */
.heart {
    position: fixed;
    bottom: 0;
    font-size: 24px;
    animation: floatUp 2s ease-out forwards;
}

@keyframes floatUp {
    0% { transform: translateY(0); opacity: 1; }
    100% { transform: translateY(-200px); opacity: 0; }
}
</style>
</head>

<body>

<h1>Doğum Günün Kutlu Olsun 🎂💘</h1>

<img src="a.png" id="character" alt="Karakter">

<div class="buttons">
    <button onclick="kiss()">💋 Öp</button>
    <button onclick="love()">🫶 Sev</button>
    <button onclick="slap()">👋 Tokat</button>
    <button onclick="kick()">🦵 Tekme</button>
</div>

<div id="reaction"></div>

<script>
// SESLER
const soundOh  = new Audio("oh.mp3");
const soundAh  = new Audio("ah.mp3");
const soundAh2 = new Audio("ah2.mp3");
const bgMusic  = new Audio("bg.mp3");

bgMusic.loop = true;
bgMusic.volume = 0.3;

let musicStarted = false;

function startMusic() {
    if (!musicStarted) {
        bgMusic.play();
        musicStarted = true;
    }
}

function playSound(sound, text) {
    startMusic();
    sound.currentTime = 0;
    sound.play();
    document.getElementById("reaction").innerText = text;
}

// 💖 KALP EFEKTİ
function createHeart() {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerText = "💖";
    heart.style.left = Math.random() * 100 + "vw";
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 2000);
}

// 📳 TİTREŞİM
function vibrate(ms) {
    if (navigator.vibrate) {
        navigator.vibrate(ms);
    }
}

// BUTONLAR
function kiss() {
    playSound(soundOh, "Ohhh 😌💋");
    for (let i = 0; i < 5; i++) createHeart();
}

function love() {
    startMusic();
    document.getElementById("reaction").innerText =
        "Seni çoook seviyorum 💞";
    for (let i = 0; i < 3; i++) createHeart();
}

function slap() {
    playSound(soundAh, "Ayy! 😵");
    vibrate(200);
}

function kick() {
    playSound(soundAh2, "Ahhh! 😭");
    vibrate([100, 50, 100]);
}
</script>

</body>
</html>
